version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: [ "xunit*", "Microsoft.NET.Test.Sdk", "coverlet*", "FsCheck*", "BenchmarkDotNet*", "Microsoft.CodeAnalysis*Testing*" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
